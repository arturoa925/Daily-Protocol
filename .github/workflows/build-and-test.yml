name: Build and test

# Runs on pushes to the Claude working branch and on demand. Unit tests only:
# the UI tests are slow and need a stable simulator, so run those locally with Cmd+U.
on:
  push:
    branches: [claude/great-keller-23cv28]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      # Same simulator the README uses; present on the runner image.
      SIM_NAME: iPhone 17
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "Launch Control.xcodeproj" \
            -scheme "Launch Control" \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -only-testing:"Launch ControlTests" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | tail -n 200

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
